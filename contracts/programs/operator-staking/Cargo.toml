[package]
name = "operator-staking"
version = "1.0.0"
description = "Staking, delegation and alert-based slashing for OCR2 node operators"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "operator_staking"

[features]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.0"
anchor-spl = "0.31.0"
store = { version = "1.0.1", path = "../store", default-features = false, features = ["cpi"] }

[lints]
workspace = true
